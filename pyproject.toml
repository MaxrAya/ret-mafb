[project]
name = "mafia-bot"
version = "1.0.0"
description = "Telegram Mafia game bot (aiogram 3)"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.31.0",
    "sqlalchemy[asyncio]==2.1.8",
    "aiosqlite==0.22.1",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mafia*"]
